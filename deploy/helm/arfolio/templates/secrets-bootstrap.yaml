{{- if and .Values.secrets.generate (not .Values.secrets.existingSecret) }}
{{- /*
The Secret exists only in the cluster (never in the chart or Git): this hook creates it with random hex values on the
first run and afterwards only adds keys that are missing. Existing keys are never modified. The Secret is not a chart
resource, so Helm neither tracks nor deletes it. The RBAC is limited to this one Secret.
*/ -}}
{{- $name := printf "%s-secrets-bootstrap" (include "arfolio.fullname" .) }}
{{- $hook := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation" "argocd.argoproj.io/hook" "Sync" "argocd.argoproj.io/hook-delete-policy" "BeforeHookCreation" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "arfolio.componentLabels" (dict "root" . "component" "secrets-bootstrap") | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-7" "argocd.argoproj.io/sync-wave" "-4") $hook) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "arfolio.componentLabels" (dict "root" . "component" "secrets-bootstrap") | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-7" "argocd.argoproj.io/sync-wave" "-4") $hook) | nindent 4 }}
rules:
  # "create" cannot be limited by name in Kubernetes RBAC; reads and patches are limited to the one Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "arfolio.secretName" . | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "arfolio.componentLabels" (dict "root" . "component" "secrets-bootstrap") | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-7" "argocd.argoproj.io/sync-wave" "-4") $hook) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "arfolio.componentLabels" (dict "root" . "component" "secrets-bootstrap") | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-7" "argocd.argoproj.io/sync-wave" "-4") $hook) | nindent 4 }}
data:
  secrets-bootstrap.sh: |
    {{- .Files.Get "scripts/secrets-bootstrap.sh" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "arfolio.componentLabels" (dict "root" . "component" "secrets-bootstrap") | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-5" "argocd.argoproj.io/sync-wave" "-3") $hook) | nindent 4 }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "arfolio.componentLabels" (dict "root" . "component" "secrets-bootstrap") | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      {{- include "arfolio.scheduling" . | nindent 6 }}
      containers:
        - name: bootstrap
          image: {{ .Values.secrets.bootstrap.image.repository }}:{{ .Values.secrets.bootstrap.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HOME
              value: /tmp
            - name: NAMESPACE
              value: {{ .Release.Namespace }}
            - name: SECRET
              value: {{ include "arfolio.secretName" . | quote }}
            {{- if not .Values.postgresql.enabled }}
            # External database: the owner password lives in externalDatabase.existingSecret, so none is generated.
            - name: KEYS
              value: "APP_DB_PASSWORD BETTER_AUTH_SECRET ENCRYPTION_KEY SETUP_TOKEN RESTIC_PASSWORD"
            {{- end }}
          securityContext:
            {{- include "arfolio.containerSecurity" . | nindent 12 }}
          command: ["/bin/sh", "/scripts/secrets-bootstrap.sh"]
          resources:
            {{- toYaml .Values.secrets.bootstrap.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: scripts
          configMap:
            name: {{ $name }}
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "arfolio.fullname" . }}-web
  labels:
    {{- include "arfolio.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "arfolio.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arfolio.fullname" . }}-web
  labels:
    {{- include "arfolio.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "arfolio.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "arfolio.componentLabels" (dict "root" . "component" "web") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "arfolio.podCommon" . | nindent 6 }}
      securityContext:
        {{- include "arfolio.podSecurity" . | nindent 8 }}
      {{- include "arfolio.scheduling" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "arfolio.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["web"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            {{- include "arfolio.commonEnv" . | nindent 12 }}
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "arfolio.secretName" . }}
                  key: BETTER_AUTH_SECRET
            - name: SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "arfolio.secretName" . }}
                  key: SETUP_TOKEN
            - name: APP_URL
              value: {{ .Values.app.url | quote }}
            - name: BETTER_AUTH_URL
              value: {{ .Values.app.url | quote }}
            - name: BRAND_NAME
              value: {{ .Values.app.brandName | quote }}
            {{- with .Values.app.brandPrimaryColor }}
            - name: BRAND_PRIMARY_COLOR
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.app.brandLogoUrl }}
            - name: BRAND_LOGO_URL
              value: {{ . | quote }}
            {{- end }}
            - name: DEFAULT_LOCALE
              value: {{ .Values.app.defaultLocale | quote }}
            - name: CLIENT_IP_HEADER
              value: {{ .Values.app.clientIpHeader | quote }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            {{- include "arfolio.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi

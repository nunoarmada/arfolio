{{- if .Values.networkPolicy.enabled }}
{{- /*
Postgres accepts connections only from the Arfolio pods that need it (web, worker, migrate, backup).
web accepts traffic only from the ingress controller (kubelet probes are not affected).
Egress stays open on purpose: the app calls bank and AI APIs.
*/ -}}
{{- if .Values.postgresql.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "arfolio.fullname" . }}-postgres
  labels:
    {{- include "arfolio.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      {{- include "arfolio.selectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  {{- range $c := list "web" "worker" "migrate" "backup" }}
                  - {{ include "arfolio.fullname" $ }}-{{ $c }}
                  {{- end }}
      ports:
        - protocol: TCP
          port: 5432
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "arfolio.fullname" . }}-web
  labels:
    {{- include "arfolio.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "arfolio.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressController.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingressController.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 3000
{{- end }}
